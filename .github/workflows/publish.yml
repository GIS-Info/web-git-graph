name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      # Trusted Publishing needs npm ≥ 11.5.1 for OIDC; do not set
      # NODE_AUTH_TOKEN or the CLI falls back to legacy token auth.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
      # pnpm publish rewrites workspace:* dependencies to the real versions;
      # order follows the dependency graph (protocol first).
      - run: pnpm --filter @web-git-graph/protocol publish --access public --no-git-checks --provenance
      - run: pnpm --filter @web-git-graph/web publish --access public --no-git-checks --provenance
      - run: pnpm --filter @web-git-graph/node publish --access public --no-git-checks --provenance
